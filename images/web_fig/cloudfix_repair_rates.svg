<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Complete policy repair rates</title>
  <desc id="desc">282 AWS policies. Baseline versus CloudFix: 10 requests, 48.2% versus 84.0%; 20 requests, 52.8% versus 60.3%; 30 requests, 22.3% versus 54.3%; 50 requests, 0.0% versus 2.5%. Complete repair means satisfying every supplied request specification. Source: CloudFix, Table III.</desc>
  <metadata>Source: https://arxiv.org/html/2512.09957v2#S5.T3. Percent of 282 policies completely repaired in each request-size experiment.</metadata>
  <rect width="1200" height="600" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#171717">
    <text x="30" y="44" font-size="32" font-weight="bold">Complete policy repair rates</text>
    <text x="30" y="82" font-size="24" fill="#4a4a4a">282 AWS policies; all supplied requests satisfied</text>
    <rect x="800" y="25" width="26" height="22" fill="#d6dfe7" stroke="#6b7b89"/>
    <text x="838" y="44" font-size="24">Baseline</text>
    <rect x="978" y="25" width="26" height="22" fill="#0077b6"/>
    <text x="1016" y="44" font-size="24">CloudFix</text>
    <text x="145" y="127" text-anchor="end" font-size="22" fill="#4a4a4a">Requests</text>
    <line x1="180.0" y1="138" x2="180.0" y2="515" stroke="#e3e0da"/>
    <text x="180.0" y="551" text-anchor="middle" font-size="23" fill="#4a4a4a">0%</text>
    <line x1="390.0" y1="138" x2="390.0" y2="515" stroke="#e3e0da"/>
    <text x="390.0" y="551" text-anchor="middle" font-size="23" fill="#4a4a4a">25%</text>
    <line x1="600.0" y1="138" x2="600.0" y2="515" stroke="#e3e0da"/>
    <text x="600.0" y="551" text-anchor="middle" font-size="23" fill="#4a4a4a">50%</text>
    <line x1="810.0" y1="138" x2="810.0" y2="515" stroke="#e3e0da"/>
    <text x="810.0" y="551" text-anchor="middle" font-size="23" fill="#4a4a4a">75%</text>
    <line x1="1020.0" y1="138" x2="1020.0" y2="515" stroke="#e3e0da"/>
    <text x="1020.0" y="551" text-anchor="middle" font-size="23" fill="#4a4a4a">100%</text>
    <text x="145" y="182" text-anchor="end" font-size="28">10</text>
    <rect x="180" y="150" width="404.88" height="24" fill="#d6dfe7" stroke="#6b7b89"/>
    <text x="596.88" y="171" font-size="25">48.2%</text>
    <rect x="180" y="184" width="705.60" height="24" fill="#0077b6" stroke="#0077b6"/>
    <text x="897.60" y="205" font-size="25">84.0%</text>
    <text x="145" y="276" text-anchor="end" font-size="28">20</text>
    <rect x="180" y="244" width="443.52" height="24" fill="#d6dfe7" stroke="#6b7b89"/>
    <text x="635.52" y="265" font-size="25">52.8%</text>
    <rect x="180" y="278" width="506.52" height="24" fill="#0077b6" stroke="#0077b6"/>
    <text x="698.52" y="299" font-size="25">60.3%</text>
    <text x="145" y="370" text-anchor="end" font-size="28">30</text>
    <rect x="180" y="338" width="187.32" height="24" fill="#d6dfe7" stroke="#6b7b89"/>
    <text x="379.32" y="359" font-size="25">22.3%</text>
    <rect x="180" y="372" width="456.12" height="24" fill="#0077b6" stroke="#0077b6"/>
    <text x="648.12" y="393" font-size="25">54.3%</text>
    <text x="145" y="464" text-anchor="end" font-size="28">50</text>
    <text x="192.00" y="453" font-size="25">0.0%</text>
    <rect x="180" y="466" width="21.00" height="24" fill="#0077b6" stroke="#0077b6"/>
    <text x="213.00" y="487" font-size="25">2.5%</text>
    <text x="30" y="589" font-size="21" fill="#4a4a4a">Source: CloudFix, Table III (arXiv:2512.09957v2)</text>
  </g>
</svg>
